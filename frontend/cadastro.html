<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Academia Fácil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-formulario">
  <main class="cartao">
    <h1>Criar conta</h1>
    <form id="form-cadastro">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" required minlength="2" autocomplete="name">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required minlength="6" autocomplete="new-password">
      <button type="submit">Cadastrar</button>
    </form>
    <p id="mensagem" class="mensagem" role="status"></p>
    <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
